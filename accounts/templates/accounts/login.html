{% extends "base.html" %}

{% block title %}Login | Inkspace{% endblock %}

{% block content %}
<div class="card">
  <h2>Welcome back</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {{form.as_p}}
    <button type="submit" class="btn block">Login</button>
  </form>

  <div class="links">
    <p><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
    <p>New here? <a href="{% url 'register' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
