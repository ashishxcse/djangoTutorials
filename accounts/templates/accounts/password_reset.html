{% extends "base.html" %}

{% block title %}Reset password | Inkspace{% endblock %}

{% block content %}
<div class="card">
  <h2>Forgot your password?</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {{form.as_p}}
    <button type="submit" class="btn block">Change Password</button>
  </form>

  <div class="links">
    <p><a href="{% url 'login' %}">Back to login</a></p>
  </div>
</div>
{% endblock %}
