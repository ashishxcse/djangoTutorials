{% extends "base.html" %}

{% block title %}Sign up | Inkspace{% endblock %}

{% block content %}
<div class="card">
  <h2>Create your account</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {{form.as_p }}
    <button type="submit" class="btn block">Sign up</button>
  </form>

  <div class="links">
    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </div>
</div>
{% endblock %}
